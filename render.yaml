services:
  - type: web
    name: rag-agentic-chatbot
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn llama:app --workers 1 --threads 2 --timeout 300 --bind 0.0.0.0:$PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: PYTHON_VERSION
        value: "3.10.11"